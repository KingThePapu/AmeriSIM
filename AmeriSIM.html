function ch(){R=calc();sv();render()}
function sv(){ls.s("amerisim2_auto",{S,p,ph})}
function skel(){const c=C[S.c],cols=Math.ceil(Math.sqrt(R.n*1.6)),lg=S.mode=="leg";
return`<div class=card><div class=row><button class="b ${!lg?"on":""}" data-a=mode data-v=pres>🗳️ Presidencial</button><button class="b ${lg?"on":""}" data-a=mode data-v=leg>🏛️ Legislativo</button></div>
<div class=row id=sp>${[1,5,10].map(x=>`<button class="b ${sp==x?"on":""}" data-a=sp data-v=${x}>${x}x</button>`).join("")}<button class=b data-a=inst>⚡ De una</button></div>
<div class=row><button class="b pri" data-a=run id=rb>▶ Iniciar</button><button class=b data-a=rst>↺ Reiniciar</button><button class=b data-a=nw>🎲 Nuevo sorteo</button></div>
<label>Volatilidad ${S.vol}% <input type=range min=0 max=100 value=${S.vol} data-f=vol></label>
${lg?`<div class=row><select data-f=sys><option value=dh ${S.sys=="dh"?"selected":""}>D'Hondt</option><option value=hn ${S.sys=="hn"?"selected":""}>Hare (resto mayor)</option></select><label>Umbral % <input type=number min=0 max=20 style="width:64px" value=${S.th} data-f=th></label><label>Escaños <input type=number min=${R.n} style="width:80px" value=${R.Tt} data-f=seatsOv></label></div>`:""}</div>
<div class=card><div id=bn></div><div class=bar style="margin-top:6px"><i id=pg style="background:var(--ac)"></i></div><small id=pt></small><div id=mp class=map style="grid-template-columns:repeat(${cols},1fr)"></div></div>
<div class=card id=bars></div>${lg?`<div class=card id=hm></div>`:""}<div class=card id=dt></div>`}
function upd(){if(tab!="sim"||!$("#mp"))return;const V=view(),E=R.E,c=C[S.c],lg=S.mode=="leg",two=ph==2&&R.r2,es=two?R.r2.f.map(j=>E[j]):E,fin=p>=1&&(ph==2||!R.r2),od=es.map((_,j)=>j).sort((a,b)=>V.nat[b]-V.nat[a]);
let SO=null;if(lg)SO=seatsOf(V.sh,V.cv);
$("#mp").innerHTML=V.sh.map((s,i)=>{const o=s.map((_,j)=>j).sort((a,b)=>s[b]-s[a]),t=o[0],m=s[t]-(s[o[1]]||0),on=V.cv[i]>.02;return`<div class="t ${on?"c":""} ${sel==i?"sel":""}" data-a=tile data-i=${i} title="${h(R.nm[i])}" style="${on?`background:color-mix(in srgb,${es[t].c} ${Math.min(100,40+m*180)}%,var(--cd))`:""}"><b>${ab(R.nm[i])}</b><small style="color:inherit">${lg?R.rs[i]:on?Math.round(s[t]*100)+"%":""}</small></div>`}).join("");
$("#bars").innerHTML=od.map(j=>{const e=es[j],v=V.nat[j]*100;return`<div class=br><span class=lg style="background:${e.c}">${lgH(e)}</span><div class=bx><div class=bt><b>${h(e.n)}</b><span>${v.toFixed(1)}%</span></div><small>${h(e.l)}${e.m&&e.m.length>1?" · "+e.m.length+" partidos":""}</small><div class=bar><i style="width:${v}%;background:${e.c}"></i></div></div></div>`}).join("");
let b=`${c[1]} <b>${h(c[0])}</b> · ${R.n} ${c[3].toLowerCase()}(s)`;if(two)b+=`<br>⚔️ Balotaje: ${h(es[0].n)} vs ${h(es[1].n)}<br><small>1ª vuelta: ${R.nat.map((x,j)=>[x,j]).sort((a,b)=>b[0]-a[0]).slice(0,3).map(q=>h(E[q[1]].n)+" "+(q[0]*100).toFixed(1)+"%").join(" · ")}</small>`;
if(fin){if(lg){const j=SO.t.indexOf(Math.max(...SO.t)),m=SO.t[j]>R.Tt/2;b+=`<br>🏆 <b>${h(E[j].n)}</b> ${SO.t[j]} escaños · ${m?"mayoría absoluta":"mayoría relativa: necesita pacto ("+(Math.floor(R.Tt/2)+1)+")"}`}else if(S.c==15){const ev=E.map(()=>0);V.sh.forEach((s,i)=>{if(V.cv[i]>=1)ev[s.indexOf(Math.max(...s))]+=R.rs[i]?R.rs[i]+2:3});const j=ev.indexOf(Math.max(...ev));b+=`<br>🏛️ Colegio Electoral: ${E.map((e,k)=>[e,ev[k]]).filter(x=>x[1]).sort((a,z)=>z[1]-a[1]).map(x=>h(x[0].n)+" "+x[1]).join(" · ")}<br>${ev[j]>=270?"🏆 <b>"+h(E[j].n)+"</b> gana con "+ev[j]:"Nadie llega a 270: decide la Cámara"} (270 para ganar)`}else b+=`<br>🏆 <b>${h(es[od[0]].n)}</b> gana${two?" el balotaje":""} con ${(V.nat[od[0]]*100).toFixed(1)}%`}
$("#bn").innerHTML=b;$("#pg").style.width=V.pr*100+"%";$("#pt").textContent=Math.round(V.pr*100)+"% escrutado"+(two?" (balotaje)":"");
if(lg){$("#hm").innerHTML=hemi(SO.L,SO.gr,R.Tt)+`<div class=row>${SO.L.filter(x=>x.s).sort((a,b)=>b.s-a.s).map(x=>`<span class=ck><i style="width:10px;height:10px;border-radius:50%;background:${x.c};display:inline-block"></i><small>${h(x.n)} <b>${x.s}</b></small></span>`).join("")}</div><small>Mayoría: ${Math.floor(R.Tt/2)+1} de ${R.Tt} · gris = sin escrutar</small>`}
$("#dt").innerHTML=sel<0?"<small>Toca un cuadro para ver el detalle de esa subdivisión.</small>":`<b>${h(R.nm[sel])}</b><small> (${c[3]})</small>${lg?` · ${R.rs[sel]} escaños`:""}<small> · ${Math.round(V.cv[sel]*100)}% escrutado</small>${od.map(j=>`<div class=row><span style="width:10px;height:10px;border-radius:50%;background:${es[j].c}"></span><small style="flex:1">${h(es[j].n)}</small><b>${(V.sh[sel][j]*100).toFixed(1)}%</b></div>`).join("")}<button class=b data-a=etile>✏️ Personalizar este resultado</button>`}
function bt(){const x=$("#rb");if(x)x.textContent=run?"⏸ Pausa":"▶ Iniciar"}
function stop(){run=!1;tok++;clearInterval(tm)}
function loop(){clearInterval(tm);tm=setInterval(()=>{p=Math.min(1,p+.1*sp/30);upd();if(p>=1){stop();if(ph==1&&R.r2){const id=tok;setTimeout(()=>{if(tok!=id)return;ph=2;p=0;run=!0;loop();bt()},1200)}bt();sv()}},100)}
function start(){if(run){stop();bt();return}if(p>=1&&ph==2||p>=1&&!R.r2){p=0;ph=1;S.seed=String(Math.random()*1e9|0);R=calc();render()}else if(p>=1&&R.r2){ph=2;p=0}run=!0;loop();bt()}
function rd(f,cb){if(!f)return;const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const k=document.createElement("canvas");k.width=k.height=64;k.getContext("2d").drawImage(im,0,0,64,64);cb(k.toDataURL("image/png"))};im.src=r.result};r.readAsDataURL(f)}
const fld=(o,i,t,k,l,ty="text")=>`<label>${l}<input type=${ty} value="${h(o[k])}" data-t=${t} data-i=${i} data-f=${k}></label>`;
function pParties(){return`<div class=row><button class="b pri" data-a=np>➕ Nuevo partido</button></div>`+S.parties.map((x,i)=>`<div class=card><div class=row><span class=lg style="background:${x.c}">${lgH(x)}</span><div style="flex:1"><b>${h(x.n)}</b><br><small>${h(x.l)}</small></div><button class=b data-a=ed data-i=${i}>${ed==i?"Cerrar":"Editar"}</button></div>${ed==i?`<div class=fm>${fld(x,i,"p","n","Partido")}${fld(x,i,"p","l","Líder")}${fld(x,i,"p","lg","Logo (emoji o texto)")}<label>Subir logo <input type=file accept=image/* data-t=p data-i=${i} data-f=file></label>${fld(x,i,"p","c","Color","color")}<label>Fuerza base (todos iguales = gana cualquiera): ${x.pop}<input type=range min=1 max=60 value=${x.pop} data-t=p data-i=${i} data-f=pop></label><label>Ideología (izquierda → derecha): ${x.ide}<input type=range min=0 max=100 value=${x.ide} data-t=p data-i=${i} data-f=ide></label><button class=b data-a=dp data-i=${i}>🗑️ Eliminar</button></div>`:""}</div>`).join("")}
function pAll(){return`<div class=row><button class="b pri" data-a=na>➕ Nueva alianza</button></div><small>Los partidos de una alianza compiten como una sola lista y se reparten los escaños. Mínimo 2 partidos.</small>`+S.alls.map((a,i)=>`<div class=card><div class=row><span class=lg style="background:${a.c}">${lgH({lg:a.lg||"🤝"})}</span><b>${h(a.n)}</b><button class=b data-a=da data-i=${i}>🗑️</button></div><div class=fm>${fld(a,i,"a","n","Nombre del pacto")}${fld(a,i,"a","l","Candidato/líder (vacío = primer partido)")}${fld(a,i,"a","lg","Logo (emoji)")}${fld(a,i,"a","c","Color","color")}</div><div>${S.parties.map(x=>`<label class=ck><input type=checkbox ${a.m.includes(x.id)?"checked":""} data-t=m data-i=${i} data-f=${x.id}>${h(x.n)}</label>`).join("")}</div></div>`).join("")}
function pCustom(){const E=R.E,v=cu<0?E.map(e=>S.ov.all&&S.ov.all[e.id]!=null?S.ov.all[e.id]:e.pop):R.reg[cu].map(x=>+(x*100).toFixed(1));
return`<div class=card><select data-f=cu><option value=-1 ${cu<0?"selected":""}>🌎 General (todo el país)</option>${R.reg.map((_,i)=>`<option value=${i} ${cu==i?"selected":""}>${h(R.nm[i])}</option>`).join("")}</select><p><small>${cu<0?"Fuerza base de cada lista a nivel nacional; las subdivisiones varían alrededor.":"Porcentajes exactos para esta subdivisión (se normalizan a 100%)."}</small></p>${E.map((e,j)=>`<div class=row><span class=lg style="background:${e.c}">${lgH(e)}</span><span style="flex:1">${h(e.n)}</span><input type=number step=.1 min=0 style="width:84px" data-k="${e.id}" value="${v[j]}"></div>`).join("")}<div class=row><button class="b pri" data-a=ap>Aplicar y ver</button><button class=b data-a=cl>Quitar personalización</button></div><small>Subdivisiones personalizadas: ${Object.keys(S.ov.reg).length}${S.ov.all?" · general activa":""}</small></div>`}
function pSave(){const sl=ls.g("amerisim_slots")||[];return`<div class=card><div class=row><input type=text id=sn placeholder="Nombre de la partida" style="flex:1"><button class="b pri" data-a=svs>💾 Guardar</button></div>${sl.map((x,i)=>`<div class=row><span style="flex:1">${h(x.n)}<br><small>${h(x.t)}</small></span><button class=b data-a=ld data-i=${i}>Cargar</button><button class=b data-a=del data-i=${i}>🗑️</button></div>`).join("")||"<small>Aún no hay partidas guardadas. Se autoguarda tu último estado.</small>"}</div><div class=card><b>Exportar / importar</b><textarea id=ex rows=5 placeholder="Pega aquí un JSON para importar"></textarea><div class=row><button class=b data-a=exp>Exportar</button><button class=b data-a=imp>Importar</button></div></div>`}
function render(){$("#tabs").innerHTML=T.map(t=>`<button class="${tab==t[0]?"on":""}" data-a=tab data-v=${t[0]}>${t[1]}</button>`).join("");$("#m").innerHTML=({sim:skel,pt:pParties,al:pAll,cu:pCustom,sv:pSave}[tab])();upd();bt()}
function load(d){stop();S=d.S;p=d.p||0;ph=d.ph||1;sel=-1;cu=-1;$("#cs").value=S.c;R=calc();sv();tab="sim";render()}
function reset(){stop();p=0;ph=1;sel=-1}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const d=t.dataset,i=+d.i;switch(d.a){
case"tab":tab=d.v;render();break;
case"mode":S.mode=d.v;reset();ch();break;
case"sp":sp=+d.v;document.querySelectorAll("#sp [data-a=sp]").forEach(x=>x.classList.toggle("on",x==t));break;
case"inst":stop();if(p>=1){S.seed=String(Math.random()*1e9|0);R=calc()}p=1;ph=R.r2?2:1;upd();bt();sv();break;
case"run":start();break;
case"rst":reset();render();sv();break;
case"nw":S.seed=String(Math.random()*1e9|0);reset();ch();break;
case"tile":sel=i;upd();break;
case"etile":cu=sel;tab="cu";render();break;
case"ed":ed=ed==i?-1:i;render();break;
case"np":S.parties.push({id:"p"+Date.now(),n:"Nuevo partido",l:"Líder",c:"#"+(rn(String(Date.now()))*16777215|0).toString(16).padStart(6,"0"),lg:"🏳️",pop:15,ide:50});ed=S.parties.length-1;ch();break;
case"dp":if(S.parties.length>2){S.alls.forEach(a=>a.m=a.m.filter(x=>x!=S.parties[i].id));S.parties.splice(i,1);ed=-1;ch()}break;
case"na":S.alls.push({id:"a"+Date.now(),n:"Gran Pacto",l:"",c:"#0ea5e9",lg:"🤝",m:[]});ch();break;
case"da":S.alls.splice(i,1);ch();break;
case"ap":{const o={};document.querySelectorAll("[data-k]").forEach(x=>o[x.dataset.k]=Math.max(0,+x.value||0));if(cu<0)S.ov.all=o;else{const s=Object.values(o).reduce((a,b)=>a+b,0)||1;for(const k in o)o[k]/=s;S.ov.reg[cu]=o}R=calc();stop();p=1;ph=R.r2?2:1;tab="sim";sv();render();break}
case"cl":if(cu<0)S.ov.all=null;else delete S.ov.reg[cu];ch();break;
case"svs":{const sl=ls.g("amerisim_slots")||[];sl.unshift({n:$("#sn").value||"Partida "+(sl.length+1),t:new Date().toLocaleString("es"),d:{S,p,ph}});ls.s("amerisim_slots",sl.slice(0,20));render();break}
case"ld":load((ls.g("amerisim_slots")||[])[i].d);break;
case"del":{const sl=ls.g("amerisim_slots")||[];sl.splice(i,1);ls.s("amerisim_slots",sl);render();break}
case"exp":$("#ex").value=JSON.stringify({S,p,ph});break;
case"imp":try{const d=JSON.parse($("#ex").value);if(d.S&&d.S.parties)load(d)}catch(x){$("#ex").value="JSON no válido"}break}});
document.addEventListener("change",e=>{const x=e.target,d=x.dataset;if(!d.f)return;const v=x.value;
if(d.f=="cu"){cu=+v;render();return}
if(d.t=="p"){const o=S.parties[d.i];if(d.f=="file"){rd(x.files[0],u=>{o.lg=u;ch()});return}o[d.f]=d.f=="pop"||d.f=="ide"?+v:v}
else if(d.t=="a"){const o=S.alls[d.i];if(d.f=="file")return;o[d.f]=v}
else if(d.t=="m"){S.alls.forEach(a=>{a.m=a.m.filter(q=>q!=d.f)});if(x.checked)S.alls[d.i].m.push(d.f)}
else if(d.f=="sys")S.sys=v;else if(d.f=="seatsOv")S.seatsOv=+v||null;else S[d.f]=+v;ch()});
$("#cs").innerHTML=C.map((c,i)=>`<option value=${i}>${c[1]} ${c[0]} (${NM[i].split("|").length})</option>`).join("");$("#cs").value=S.c;
$("#cs").onchange=e=>{S.c=+e.target.value;S.ov={all:null,reg:{}};S.seatsOv=null;S.seed=String(Math.random()*1e9|0);reset();ch()};
R=calc();render();
</script></body></html>
